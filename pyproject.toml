[project]
name = "knowyourdiff"
version = "0.0.0"
description = "60-second comprehension checks for AI-written code, graded by an LLM judge whose accuracy we publish."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Joothiswaran" }]
keywords = ["git", "pre-commit", "learning", "llm-as-judge", "mcp", "code-review", "education"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "unidiff>=0.7.5",
    # 0.26.0 crashes the interpreter (access violation) on Windows when reading node fields.
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/Joothis/knowyourdiff"
Issues = "https://github.com/Joothis/knowyourdiff/issues"
Changelog = "https://github.com/Joothis/knowyourdiff/blob/main/CHANGELOG.md"

[project.scripts]
kyd = "knowyourdiff.cli:app"
knowyourdiff = "knowyourdiff.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowyourdiff"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "C4"]
ignore = [
    "S603",   # subprocess without shell is our deliberate pattern (see git.py)
    "SIM905", # word lists written as "a b c".split() read better than long list literals
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["unidiff.*", "tree_sitter_python", "tree_sitter_javascript", "tree_sitter_typescript"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["knowyourdiff"]
branch = true
